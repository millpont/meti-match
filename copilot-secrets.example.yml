# Template for `copilot secret init --cli-input-yaml copilot-secrets.yml`.
# Copy to copilot-secrets.yml (gitignored) and fill in real values from the shared METI .env.
# Most values are identical to METI's; the ones that MUST differ are called out.
secrets:
  APP_SECRET_KEY:
    production: "<generate a NEW random secret — do not reuse METI's>"
  # A NEW Auth0 application (its own client id/secret) with this app's callback URL registered.
  AUTH0_CLIENT_ID:
    production: "<new-auth0-app-client-id>"
  AUTH0_CLIENT_SECRET:
    production: "<new-auth0-app-client-secret>"
  AUTH0_DOMAIN:
    production: "<same-auth0-tenant-domain-as-meti>"
  AUTH0_CALLBACK_URL:
    production: "https://<this-app-domain>/callback"
  # Same Supabase Postgres instance as METI.
  DB_NAME:
    production: "postgres"
  DB_USER:
    production: "<db-user>"
  DB_PASSWORD:
    production: "<db-password>"
  DB_HOST:
    production: "<supabase-host>"
  DB_PORT:
    production: "5432"
  # MillPont account UUID (the approver). Change if a different account should administer.
  SUPERADMIN_ACCOUNT_ID:
    production: "22bcddb8-fee7-4fb2-b03a-f8136c0f44b3"
